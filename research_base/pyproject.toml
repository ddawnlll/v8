[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v8research"
version = "0.1.0"
description = "V8 Progressive Evidence Research System - offline research compiler"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
store = ["pyarrow>=18", "duckdb>=1.3"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
v8research = "v8research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

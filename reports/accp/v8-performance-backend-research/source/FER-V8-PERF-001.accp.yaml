  sections:
    feature_request_summary:
      summary: Determine whether V8 should adopt MLX, Numba, a Rust native kernel/library, continued optimized Python, or a genuinely workload-specific hybrid. This FER is an evidence gate only and does not authorize a backend implementation.
      items:
      - id: FRS001
        label: FACT
        text: The first question is whether a measured binding runtime problem remains after V8's structural optimizations; the investigation does not assume that Python is the bottleneck.
        evidence_refs:
        - user_request
        - docs/CHANGELOG.md
        confidence: high
      - id: FRS002
        label: FACT
        text: The repository distinguishes canonical decision/research execution from offline diagnostic, regret, replay, and statistical/report tooling. A backend decision therefore must be workload-specific unless common evidence proves a shared bottleneck.
        evidence_refs:
        - docs/contracts/ARCHITECTURE_SPEC.md
        - tools/diagnostics.py
        - tools/regret.py
        confidence: high
      - id: FRS003
        label: DECISION
        text: The current evidence supports RETAIN_PYTHON for the canonical Lab architecture and does not justify an MLX, Numba, or Rust migration FDR yet. A narrow Rust replay-kernel benchmark remains the smallest migration-discriminating next step for offline diagnostics.
        evidence_refs:
        - docs/CHANGELOG.md
        - tmp/fer_backend_probe/bench.py
        - tmp/fer_backend_probe/bench.rs
        confidence: medium
      - id: FRS004
        label: GAP
        text: No direct V8-scale Numba or MLX result exists, and the Rust probe is a toy branch-heavy kernel rather than CanonicalSimulator parity. Therefore no migrated backend receives a V8 speedup claim in this FER.
        evidence_refs:
        - command: .venv/bin/python import checks for numba and mlx -> ModuleNotFoundError
        - tmp/fer_backend_probe/bench.py
        confidence: high
    existing_surfaces:
      summary: V8 is a stdlib-first, deterministic Python research runtime with a hash-bound point-in-time state path, 27 executable registered Expert classes, append-only JSONL ledgers, a canonical Level-1 simulator, and offline diagnostic/regret replay surfaces.
      items:
      - id: ES001
        label: FACT
        text: "The composition root is Lab.run: tape JSONL replay -> MarketState/build_multi_state -> per-Expert projection -> sorted Expert.evaluate -> ExpertEvaluation/CandidateDraft -> episode_key geometry hashing -> lifecycle transitions -> RiskGate/ExposureBook -> stepped execution or counterfactual CanonicalSimulator -> states/evaluations/candidates/outcomes JSONL -> provenance and ledger hashes."
        evidence_refs:
        - src/v8/lab.py:220-1208
        - src/v8/marketstate.py:867-1546
        - src/v8/lifecycle.py:42-163
        - src/v8/risk.py:48-211
        - src/v8/simulator.py:247-700
        confidence: high
      - id: ES002
        label: FACT
        text: MarketState construction is numerical-feature and history heavy in source form, but it is also Python-object, dict, lineage-hash, and provenance heavy. Features are point-in-time gated; state_id and lineage hashes are deterministic identities, not disposable cache values.
        evidence_refs:
        - src/v8/marketstate.py:104-602
        - src/v8/marketstate.py:867-1436
        - src/v8/schema.py:102-189
        confidence: high
      - id: ES003
        label: FACT
        text: The registered execution roster is 27 concrete Expert classes plus a code-side confluence class; the 27-class performance probe invokes 27 Experts, and every registered Expert declares a 1h interval and 32-bar depth in the current registry. Expert code uses Python dataclasses, dict-keyed projected features, tuples/history, strings, branches, and in several families local history scans, min/max, sorting, and indicator predicates.
        evidence_refs:
        - src/v8/experts/__init__.py
        - docs/EXPERTS_REGISTRY.yaml
        - command: Python AST audit of src/v8/experts/*.py -> 27 ALL_EXPERT_CLASSES; all declared intervals 1h; all declared depths 32
        confidence: high
      - id: ES004
        label: FACT
        text: CanonicalSimulator.step/run is a branch-heavy, path-dependent state machine with STOP_FIRST ambiguity, gap-aware stop pricing, funding-before-orders, thesis invalidation, MAE/MFE, lifecycle-sensitive entry/exit ordering, and frozen geometry. It is not a homogeneous vector operation in its current representation.
        evidence_refs:
        - src/v8/simulator.py:303-508
        - src/v8/simulator.py:526-656
        - docs/contracts/SIMULATION_TRUTH_SPEC.md
        confidence: high
      - id: ES005
        label: FACT
        text: Candidate lifecycle, risk admission, exposure contention, serialization, and hashing are semantically observable. Experts are evaluated in sorted expert_id order, ledgers are single-writer append-only logs, and replay must remain stable across process restarts and library versions.
        evidence_refs:
        - docs/contracts/RUNTIME_SCHEDULER_SPEC.md:45-57
        - docs/contracts/RUNTIME_SCHEDULER_SPEC.md:82-92
        - docs/contracts/PERSISTENCE_REPLAY_SPEC.md:63-80
        - src/v8/store.py:16-103
        confidence: high
      - id: ES006
        label: FACT
        text: "Historical structural optimization was dominant: the D-056 state-builder pass measured 8,760 bars from about 280s to 12s, a BTCUSDT 4-year 35,064-bar Lab-shaped run at 67s, and an 8-symbol x 4-year serial-store projection at about 9 minutes instead of an estimated 11-12 hours. The change preserved state values, feature lineage, and candidate/evaluation/outcome fields."
        evidence_refs:
        - docs/CHANGELOG.md:568-620
        - tests/test_state_cache_identity.py
        confidence: high
      - id: ES007
        label: FACT
        text: Historical pipeline optimization measured 8,760-bar x 3-pilot Lab runtime 46.9s to 16.6s and 1,500-bar x 27-Expert runtime 16.4s to 8.0s; the same entry reports 306,809 diagnostic _simulate calls collapsing to 91,853 distinct walks through memoization.
        evidence_refs:
        - docs/CHANGELOG.md:374-426
        confidence: high
      - id: ES008
        label: FACT
        text: Historical diagnostic profiling measured one 540-bar BTCUSDT cell at 72.6s before and 17.4s after D-075, and a 2-symbol x 2-timeframe 60-day matrix at 102.5s wall/245.4s CPU before and 29.2s wall/71.2s CPU after with four processes. The largest measured waste was repeated _median_atr recomputation at 54.3s of 72.6s, not an unmeasured language ceiling.
        evidence_refs:
        - docs/CHANGELOG.md:197-240
        confidence: high
      - id: ES009
        label: MEASUREMENT
        text: Current cProfile on 8,760 synthetic V8-shaped bars and 27 Experts recorded 302,028,501 calls and 74.579s cumulative Lab time under profiling. Top cumulative functions were build_multi_state 23.161s, build_state 22.230s, JSON dumps/encoding 9.386s/8.490s, AppendOnlyLog.append 8.038s, store.hash 7.132s, sha1_hex 6.930s, _asdict_fast 6.767s, store.read 5.469s, counterfactual 2.697s, and simulator.run 0.976s. The profile is instrumented and is not treated as a clean wall-time percentage decomposition.
        evidence_refs:
        - command: PYTHONPATH=.:src python3 tools/_perf_probe.py profile 8760
        - tmp/fer_backend_probe/bench.py
        confidence: high
      - id: ES010
        label: MEASUREMENT
        text: Current cProfile on the last 540 real BTCUSDT 1h kline bars and all 27 diagnostic Experts recorded 65,878,078 calls and 21.422s cumulative DiagnosticEngine.run time. It measured 343,280 _simulate calls, 310,166 _compute_walk calls, 2,027,909 CanonicalSimulator.step calls at 13.180s cumulative, 8.738s in 200 random-run nulls, 4.983s in Expert forensics, and only about 0.501s in MarketState construction.
        evidence_refs:
        - command: PYTHONPATH=.:src python3 cProfile DiagnosticEngine on 540 real BTCUSDT bars
        - tools/diagnostics.py:384-489
        - tools/diagnostics.py:788-913
        confidence: high
      - id: ES011
        label: MEASUREMENT
        text: Current real multi-cell orchestration on the 10-symbol, 4-year tape, selecting BTCUSDT and ETHUSDT over 1h and 4h for 60 days with one process, completed in 57.498s wall with zero cell errors and four cells. Existing historical evidence shows the same class of matrix is parallelizable while preserving per-cell deterministic output, but current backend-specific speedups were not tested.
        evidence_refs:
        - command: time .venv/bin/python tools/diagnostics.py --tape research/tape/multi-1h-4y/tape.jsonl --out .audit/fer-multi-current --symbols BTCUSDT,ETHUSDT --timeframes 1h,4h --span-days 60 --processes 1
        - .audit/fer-multi-current/report.json
        - docs/CHANGELOG.md:374-426
        confidence: high
      - id: ES012
        label: FACT
        text: The repository records a previous 8,760-bar JSONL measurement of 5.87s of a 39.2s run in repeated log parsing/hashing (14% of wall), improved to 3.44s of a 36.7s run. A separate tape-builder optimization reduced a 960-archive grid from about 80 minutes of CPU to about 7 seconds without changing the tape contract.
        evidence_refs:
        - docs/CHANGELOG.md:541-566
        - docs/CHANGELOG.md:684-706
        confidence: high
      - id: ES013
        label: MEASUREMENT
        text: The throwaway branch-heavy OHLC probe used 2,000 V8 synthetic bars and 20,000 randomized episodes. Rust and Python produced the same checksum bdaee6c38082a6ec; Python warm execution was 0.008028s, Rust warm execution 0.004684s, Python cold execution 0.007290s, Rust kernel cold execution 0.000340s, and standalone rustc -O compilation was 0.35s. This is a kernel capability measurement only, not a V8 runtime speed claim; it excludes PyO3 conversion, ledger writes, hashing, funding, and full simulator semantics.
        evidence_refs:
        - tmp/fer_backend_probe/bench.py
        - tmp/fer_backend_probe/bench.rs
        - command: .venv/bin/python tmp/fer_backend_probe/bench.py
        - command: /usr/bin/time -p rustc -O tmp/fer_backend_probe/bench.rs -o tmp/fer_backend_probe/bench-rust-recompile
        confidence: high
      - id: ES014
        label: GAP
        text: No current memory profiler, CPU-vs-I/O hardware counter, current real full-Lab profile, Numba run, or MLX run exists. The measured evidence therefore identifies binding candidates but does not establish a production backend winner.
        evidence_refs:
        - skipped_inspections:S001
        - skipped_inspections:S002
        - skipped_inspections:S003
        confidence: high
    user_value:
      summary: "V8 value is research throughput under scientific identity constraints: lower iteration latency and replay cost, larger symbol/Expert/action-grid scale, reproducibility across machines, maintainable Expert evolution, and auditable deterministic outputs."
      items:
      - id: UV001
        label: FACT
        text: Structural optimization already delivered measured multi-fold iteration-latency improvements without changing language or runtime, including 280s to 12s for the state path and 72.6s to 17.4s for a diagnostic cell.
        evidence_refs:
        - docs/CHANGELOG.md:197-240
        - docs/CHANGELOG.md:568-620
        confidence: high
      - id: UV002
        label: INFERENCE
        text: For canonical Lab runs, the current largest measured costs are state construction, Python object/record conversion, JSON serialization, append/flush, and hashing; a simulator-only backend would leave most current cumulative cost in Python and the ledger boundary.
        evidence_refs:
        - command: PYTHONPATH=.:src python3 tools/_perf_probe.py profile 8760
        - src/v8/lab.py:965-1208
        confidence: high
      - id: UV003
        label: INFERENCE
        text: For offline diagnostic/replay workloads, a native branch-loop kernel could materially improve throughput if it accepts large batches of primitive episodes and returns ordered results once per batch; the current profile shows the target, while the toy Rust probe shows only raw-kernel potential.
        evidence_refs:
        - command: cProfile DiagnosticEngine on 540 real BTCUSDT bars
        - tmp/fer_backend_probe/bench.py
        confidence: medium
      - id: UV004
        label: RISK
        text: A second authoritative simulator implementation can reduce research velocity if every new execution policy, funding rule, ambiguity rule, lifecycle action, and provenance field requires synchronized Python and native changes plus differential validation.
        evidence_refs:
        - docs/contracts/SIMULATION_TRUTH_SPEC.md
        - reports/accp/v8-rr-v02-phase0/source/FER-V8RR-002.accp.yaml
        confidence: high
      - id: UV005
        label: FACT
        text: The current Python architecture has an explicit single-writer and sorted-evaluation contract, while diagnostic cells are already independently schedulable with deterministic per-cell seeds. This preserves a practical path to parallel scale without committing the canonical decision path to a new runtime.
        evidence_refs:
        - docs/contracts/RUNTIME_SCHEDULER_SPEC.md:45-57
        - tools/diagnostics.py:3168-3257
        confidence: high
      - id: UV006
        label: INFERENCE
        text: A future backend has highest user value if it removes repeated Python dispatch and object creation inside replay batches while leaving Expert authoring, candidate identity, risk policy, ledger ownership, and report generation in Python; broad migration has lower reversibility and higher validation cost.
        evidence_refs:
        - src/v8/lab.py
        - src/v8/simulator.py
        - docs/contracts/IMPLEMENTATION_LAYOUT.md
        confidence: medium
    risks:
      summary: The main risks are not only runtime speed; they are semantic drift, output-identity drift, portability, packaging, dependency, and research-velocity costs. Each candidate is evaluated against the same evidence boundary.
      items:
      - id: RK001
        label: RISK
        text: "MLX: the current path is not a large homogeneous tensor graph. Scalar arrays used for control flow force evaluation; dynamic per-bar branches, Python objects, variable candidate populations, hashing, serialization, and path-dependent simulator state would either remain host Python or require a primitive batched IR. MLX's Apple-unified-memory advantage does not make small heterogeneous kernels GPU-suitable."
        evidence_refs:
        - src/v8/lab.py
        - src/v8/simulator.py
        - https://ml-explore.github.io/mlx/build/html/usage/lazy_evaluation.html
        - https://ml-explore.github.io/mlx/build/html/usage/unified_memory.html
        confidence: high
      - id: RK002
        label: RISK
        text: "MLX: current official installation is strongest on Apple Silicon/macOS, with separate Linux CPU/CUDA packages and hardware/toolchain requirements. Adopting MLX for canonical results could create hardware-family and floating-point reproduction risk, while the repository's intended deployment matrix is not explicitly frozen beyond Python >=3.11 and cross-platform lock artifacts."
        evidence_refs:
        - pyproject.toml:9-10
        - uv.lock
        - https://ml-explore.github.io/mlx/build/html/install.html
        confidence: high
      - id: RK003
        label: RISK
        text: "Numba: nopython can efficiently compile numeric arrays, structured scalars, and loops, and can release the GIL, but current Experts consume dataclasses, dict-keyed features, strings, tuples/history, and Python methods. Directly decorating current ontology is unlikely to enter nopython; a typed primitive record/array IR would be required. Parallel prange also requires analyzable control flow and safe reductions."
        evidence_refs:
        - src/v8/schema.py:149-260
        - src/v8/experts/*.py
        - https://numba.readthedocs.io/en/stable/user/jit.html
        - https://numba.readthedocs.io/en/stable/reference/numpysupported.html
        - https://numba.readthedocs.io/en/stable/user/parallel.html
        confidence: high
      - id: RK004
        label: RISK
        text: "Numba: compile warm-up, specialization by input types/shapes, package availability, and a second typed representation would burden tests and reproducibility. No Numba runtime was installed, so no V8-shaped cold/warm or semantic-parity result can justify Numba-first."
        evidence_refs:
        - command: .venv/bin/python import numba -> ModuleNotFoundError
        - https://numba.readthedocs.io/en/stable/user/jit.html
        confidence: high
      - id: RK005
        label: RISK
        text: "Rust: a native replay/simulation kernel directly matches branch-heavy state-machine work and can release the GIL for safe parallel execution, but PyO3 conversion, wheel/ABI production, cross-platform builds, and a second semantic implementation are material costs. Rayon parallelism must be wrapped in a deterministic result-order/single-writer protocol."
        evidence_refs:
        - https://pyo3.rs/main/parallelism
        - https://pyo3.rs/main/building-and-distribution
        - https://docs.rs/rayon/latest/rayon/
        - docs/contracts/RUNTIME_SCHEDULER_SPEC.md
        confidence: high
      - id: RK006
        label: RISK
        text: "Rust: the parity-checked toy probe was about 1.7x faster warm, which is material for a raw loop but insufficient to support a V8-scale migration claim because the probe excluded Python/Rust conversion, real geometry, funding schedules, hashing, ledger writes, and all semantic edge cases."
        evidence_refs:
        - tmp/fer_backend_probe/bench.py
        - tmp/fer_backend_probe/bench.rs
        confidence: high
      - id: RK007
        label: RISK
        text: "Remaining Python: the current architecture may still have further safe gains in state/materialization reuse, record allocation, serialization/hash batching, and offline replay scheduling. Moving early to native code could freeze an unmeasured bottleneck and duplicate code before those simpler options are exhausted."
        evidence_refs:
        - docs/CHANGELOG.md
        - src/v8/fast.py
        - src/v8/store.py
        confidence: medium
      - id: RK008
        label: RISK
        text: "Hybrid: a Python canonical path plus a native offline replay path is only defensible if workload-specific profiles and parity tests show genuinely different binding bottlenecks. Without that evidence it becomes two implementations and a router-like governance surface, not a justified hybrid."
        evidence_refs:
        - docs/charter/V8_CONSTITUTION.md
        - docs/contracts/SIMULATION_TRUTH_SPEC.md
        - reports/accp/v8-rr-v02-phase0/source/FER-V8RR-002.accp.yaml
        confidence: high
      - id: RK009
        label: MISSING_EVIDENCE
        text: No direct MLX or Numba benchmark, no Rust/PyO3 FFI benchmark, no cross-platform reproduction, and no memory/allocation profile were available in the frozen dependency scope.
        evidence_refs:
        - skipped_inspections:S001
        - skipped_inspections:S003
        confidence: high
    open_questions:
      summary: Only questions that can change the architecture ranking remain open; repository inspection has already answered the current hot-path and semantic-boundary questions.
      items:
      - id: OQ001
        label: MISSING_EVIDENCE
        text: At V8 scale, does a Rust CanonicalSimulator/replay kernel still produce a material end-to-end gain after one batched primitive conversion per workload and ordered result return, including funding, STOP_FIRST, MAE/MFE, thesis invalidation, and all execution policies currently declared?
        evidence_refs:
        - command: cProfile DiagnosticEngine on 540 real BTCUSDT bars
        - src/v8/simulator.py:303-656
        - tmp/fer_backend_probe/bench.py
        confidence: high
      - id: OQ002
        label: MISSING_EVIDENCE
        text: Can a primitive IR for the current Expert predicates preserve all 27 registered Expert applicability decisions, history/lookback semantics, candidate geometry, and ordering while reducing the measured canonical Python dispatch/object costs? This is the key Numba-versus-Rust structural question.
        evidence_refs:
        - src/v8/experts/*.py
        - docs/EXPERTS_REGISTRY.yaml
        - command: PYTHONPATH=.:src python3 tools/_perf_probe.py profile 8760
        confidence: medium
      - id: OQ003
        label: MISSING_EVIDENCE
        text: Is there a real V8 workload with sufficiently large, homogeneous numerical batches for MLX to amortize graph/compile/device scheduling cost, rather than the current mixture of per-bar feature objects, scalar predicates, path-dependent replay, and JSONL/hash operations?

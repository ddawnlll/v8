        label: DECISION
        text: 'REQUIRED FINAL DECISION 1 - V8 x v0.2 compatibility: HIGH_COMPATIBILITY. Smallest reason: v0.2''s Replay Model is not analogous to V8''s simulator, it IS V8''s simulator - CanonicalSimulator.run(draft, future bars, times, thesis_valid) -> CounterfactualOutcome is literally Replay(C, a, W_>t; M) -> model-derived utility, versioned by sim.hash(); and the surrounding invariants v0.2 asks for (no candidate no trade, future for scoring never for features, same economic semantics, version-bound derivation, explicit NO_TRADE) are already V8 architecture, contract text or constitutional rule rather than proposals.'

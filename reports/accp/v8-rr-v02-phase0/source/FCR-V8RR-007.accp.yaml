        text: 'ATTEMPT LEDGER (attempts.jsonl, source=regret-phase2-attempt, event_id=slice_key): one row PER DECLARED SLICE (all 72, including EXCLUDED_EMPTY and INSUFFICIENT_SUPPORT ones) written BEFORE any confirmation-interval query, carrying slice_key, estimand, n_computed, effective_independent_episodes, mean, ci_lower, ci_upper, block_size, alpha_slate, practically_significant, discovery_verdict in {CANDIDATE_SYSTEMATIC, INSUFFICIENT_SUPPORT, EXCLUDED_EMPTY, NOT_MATERIAL, NOT_SIGNIFICANT}. A slice promoted to CANDIDATE_SYSTEMATIC gets exactly one further row when confirmation is queried, confirmation_verdict in {SYSTEMATIC_FINDING, FAILED_CONFIRMATION}. This IS the search-accounting object v0.2 section 10.2 and rule 11 require ("report the full search family").'
        evidence_refs:
        - 'external_document: v0.2 section 10.2'
        - docs/charter/V8_CONSTITUTION.md (rule 11)
        confidence: high
    ownership_manifest:
      summary: Ownership stays split exactly as FCR-V8RR-004 established.
      items:
      - id: OM001
        label: DECISION
        text: src/v8/statistics.py owns every estimator (block sizing, bootstrap, Reality-Check, materiality, multiplicity arithmetic) — Phase 2 code owns ONLY the slice-builder and the attempt ledger, and calls the module's public functions unmodified. No estimator logic is duplicated or re-derived.
        evidence_refs:
        - CF001
        confidence: high
      - id: OM002
        label: DECISION
        text: tools/regret.py's cube/gap output remains the ONLY input; Phase 2 never re-runs Lab or the Phase-0 evaluator, and never reads tools/diagnostics.py's population (FCR-V8RR-004 OM003, restated).
        evidence_refs:
        - FCR-V8RR-004 (OM003)
        confidence: high
    amendment_policy:
      summary: Same five amendment rules as FCR-V8RR-004, restated with one Phase-2-specific addition.
      items:
      - id: AP001
        label: DECISION
        text: Extending the discovery family (FT003) to a new Expert, symbol, or estimand is a NEW declared search and requires a new frozen contract (or an explicit, dated amendment to this one) BEFORE it is run — never added silently mid-discovery, which is exactly the adaptive-search failure mode rule 11 and v0.2 section 10.2 exist to prevent.
        evidence_refs:
        - docs/charter/V8_CONSTITUTION.md (rule 11)
        confidence: high
      - id: AP002
        label: DECISION
        text: A CANDIDATE_SYSTEMATIC finding that fails confirmation (FAILED_CONFIRMATION) is recorded permanently in the attempt ledger and MUST NOT be re-tested on a different split, a different estimand, or a different symbol grouping in search of a passing result (rule 11, "never repair a rejected hypothesis on frozen OOS" — the same discipline extended to the dev-internal discovery/confirmation split).
        evidence_refs:
        - docs/charter/V8_CONSTITUTION.md (rule 11)
        confidence: high
    final_status:
      status: ready
      safe_to_continue: 'yes'
      requires_hir: 'no'
      reason:
      - All seven contracts frozen with a named, already-tested reuse target for every estimator; zero new statistical code proposed.
      - The discovery family, minimum support, and materiality bar are declared BEFORE any slice is scored, closing the exact adaptive-search gap the task brief names.

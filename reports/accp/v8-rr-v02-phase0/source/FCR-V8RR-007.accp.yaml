        confidence: high
    frozen_types:
      summary: The seven frozen contracts, in the order the task brief requested them.
      items:
      - id: FT001
        label: DECISION
        text: 'CONTRACT 1 - ESTIMANDS. Two, named explicitly, computed per (Expert, symbol) slice from Phase-1 gap_status=COMPUTED rows only: (a) mean_legal_hindsight_gap = mean(legal_hindsight_gap) — "is value systematically left on the table inside the represented action universe" (v0.2 V_H - V_A analogue, Candidate-local); (b) mean_actual_vs_no_trade = mean(actual_utility - 0.0) = mean(actual_utility) restricted to the same COMPUTED population — "is the shipped geometry beating the zero-exposure benchmark" (the repository''s own zero-cost-edge estimand, EXCESS_COST_THRESHOLD_R companion). Both are Candidate-local per FCR-V8RR-004 FT011(iv); NEITHER is a portfolio quantity and neither may be summed across Candidates into a claimed feasible value. Every reported number states WHICH estimand it is; the two are never averaged together.'
        evidence_refs:
        - FCR-V8RR-004 (FT011)
        - 'external_document: v0.2 section 12 (H1, H2)'
        confidence: high
      - id: FT002
        label: DECISION
        text: 'CONTRACT 2 - SAMPLING UNIT. The Candidate is the nominal unit, but Candidates are NOT treated as IID: effective_independent_episodes(n_episodes, max_hold_bars) is reported beside every slice statistic, using max_hold_bars = the slice''s own max(horizon_bars) over its COMPUTED population (never a global constant — different Experts and different legal actions have different expiry_bars). The block-bootstrap block_size (select_block_size, D-052) is the operative dependence unit for every CI/p-value in this contract; a slice is not treated as N independent draws anywhere. Same-symbol overlap (two Candidates from different Experts open at once), same-Expert-different-symbol independence, and cross-symbol correlation (all 6 symbols share the same funding/macro tape) are NOT separately modelled in Phase 2 — flagged as O-022-adjacent (rule-16 exposure coupling already measured as real and large) and carried as an explicit limitation on every finding, never silently assumed away.'
        evidence_refs:
        - src/v8/statistics.py:447-472
        - docs/decisions/OPEN_DECISIONS.md#O-022
        confidence: high
      - id: FT003
        label: DECISION
        text: 'CONTRACT 3 - DISCOVERY FAMILY. The searchable dimensions, frozen BEFORE any slice is scored: Expert (the 3 certified pilots — trend_pullback, failed_breakout, liquidity_sweep_reclaim; extending to the other 25 registered families is a NEW, separately-declared search and re-opens this contract, D-046 discipline), symbol (the 6 downloaded: BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT), estimand (FT001''s two), direction (LONG/SHORT, decision-time-defined per FCR-V8RR-004 AP005 — direction is on the draft, not a context guess). Interaction depth: PAIRWISE ONLY (Expert x symbol x estimand x direction, one flat slice grid) — no Expert x Expert or symbol x symbol interactions, and NO habitat/context/regime axis (Phase 0/1 carry no such field, FCR-V8RR-004 OM002/CT003; a context claim here would be exactly the manufactured localization the fault-injection habitat case (test_fault_habitat_randomization_is_structurally_non_localizable) proved this instrument refuses). search_universe_size = 3 x 6 x 2 x 2 = 72 declared slices (some may be empty — an Expert may fire 0 times on a symbol; an empty slice is EXCLUDED_EMPTY, not a null result). Minimum support per slice, frozen pre-discovery: n_computed >= 30 (matches the repository''s own RM-08-adjacent floor reasoning) AND effective_independent_episodes >= 8.'
        evidence_refs:
        - FCR-V8RR-004 (FT001, AP005)
        - src/v8/statistics.py:708-755 (effective_search_size)
        confidence: high
      - id: FT004
        label: DECISION
        text: 'CONTRACT 4 - DEPENDENCE-AWARE UNCERTAINTY. bootstrap_ci(series, block_size, n_resamples=2000, seed=<slice-derived>, ci=0.90), with block_size = select_block_size(series) (D-052''s corrected n**(1/3)-rate tier rule, autocorrelation-gated, capped at n//2 — never the repository''s old, already-rejected bar-count constants). seed is derived deterministically per slice (sha1 of the slice key, truncated to an int) so the same slice always resamples identically across runs — never a wall-clock or run-order-dependent seed (rule 9, no wall clock in replay extends to this analysis layer by the same discipline). n_resamples=2000 matches the repository''s own already-ratified default (D-052''s resamples_for_alpha floor).'
        evidence_refs:
        - src/v8/statistics.py:243-269 (select_block_size)
        - src/v8/statistics.py:419-445 (bootstrap_ci)
        confidence: high
      - id: FT005
        label: DECISION
        text: 'CONTRACT 5 - MULTIPLICITY. Two-level, inherited from O-021''s already-adopted interim design rather than a new scheme: (a) WITHIN one Expert''s search across its own declared variants — NOT APPLICABLE in this Phase-2 pass, because the 3 certified pilots each have exactly ONE registered variant (variants_evaluated=1 per docs/EXPERTS_REGISTRY.yaml); reality_check_p_value is therefore not invoked this pass (it requires >=2 aligned configurations) and is reserved for when a challenger variant is registered. (b) ACROSS the 72-slice discovery family — Bonferroni: alpha_slate = 0.05 / effective_search_size(variants_evaluated=72, search_universe_size=72) = 0.05/72 ~ 0.000694. expected_false_positives(72, 0.05) = 3.6 is reported beside the observed count of nominally-significant slices as the repository''s own "count near expectation is evidence of NO edge" check (Aronson Ch9 p443, already the module''s documented grounding).'
        evidence_refs:
        - src/v8/statistics.py:708-731 (expected_false_positives)
        - src/v8/statistics.py:733-755 (effective_search_size)
        - docs/decisions/OPEN_DECISIONS.md#O-021
        confidence: high
      - id: FT006
        label: DECISION
        text: 'CONTRACT 6 - DISCOVERY / CONFIRMATION SPLIT. The 12-month dev window (2025-07-01..2026-06-30, trimmed 3 days for funding coverage, D-071) splits chronologically at its midpoint into a DISCOVERY interval (first ~6 months) and a CONFIRMATION interval (remaining ~6 months, held untouched during discovery), both still strictly inside the frozen 2026-07-01 holdout — this is a within-dev split, NOT a claim on the true frozen OOS, which stays reserved for a future preregistered v8_slice_001-style campaign per PREREGISTRATION_V8_SLICE_001. Every slice statistic (FT001-FT005) is computed on discovery ONLY to select candidate systematic findings; a finding is queried against confirmation AT MOST ONCE, after discovery is frozen, and confirmation is never re-queried if a finding fails there (no repair-on-reject, V8_CONSTITUTION rule 11 restated).'
        evidence_refs:
        - docs/decisions/DECISION_REGISTER.md#D-071 (trimmed dev window)
        - docs/charter/V8_CONSTITUTION.md (rule 11)
        confidence: high
      - id: FT007
        label: DECISION
        text: 'CONTRACT 7 - MATERIALITY. practical_significance(series, min_net_r, min_trades) with min_net_r = 0.05 R (half the repository''s own RM-17 profit-factor-band-adjacent economic floor reasoning, chosen conservatively small so Phase 2 does not under-report candidate findings for Phase 3 to test) and min_trades = 30 (matches FT003''s minimum-support floor exactly, so materiality and support are the same bar, never two silently different numbers).'
        evidence_refs:
        - src/v8/statistics.py:676-703 (practical_significance)
        confidence: high
    frozen_routes:
      summary: not_applicable (no service surface); the discovery-family CLI convention only.
      items:
      - id: FR001
        label: DECISION

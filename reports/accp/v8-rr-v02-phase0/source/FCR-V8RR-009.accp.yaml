    contract_freeze_summary:
      summary: 'Binds (I, Pi, E) for testing whether each of the 12 confirmed mean_legal_hindsight_gap findings (D-072) is decision-time-recoverable. Baseline I = the birth MarketState''s already-computed scalar features plus the frozen CandidateDraft fields (no future information, no regeneration of the Candidate). Pi = deterministic single-feature threshold GATES (TRADE vs NO_TRADE) over 3 declared features, plus the mandatory always-trade baseline that reproduces the deployed V8 policy exactly (the containment requirement). E = the SAME chronological discovery/confirmation split Phase 2 already used, reused rather than re-cut.'
      items:
      - id: CF001
        label: FACT
        text: 'Diagnostic groundwork (real command output, this session): for trend_pullback LONG BTCUSDT (one of the 12 confirmed slices), NO_TRADE is the sole or tied best legal action for 136/214 (63.6%) of its COMPUTED candidates — confirming NO_TRADE, not a wider-target geometry variant, is the dominant driver of the confirmed gap. This is why Pi is built around a TRADE/NO_TRADE gate rather than a geometry-widening rule: the gate targets the action that actually explains most of the measured gap.'
        evidence_refs:
        - 'command: this session, best_action_ids inspection on tmp/phase1/btcusdt/out/regret.jsonl'
        confidence: high
    frozen_types:
      summary: The three bound objects plus the promotion rule.
      items:
      - id: FT001
        label: DECISION
        text: 'I (decision-time information class) = X_t = (S_t, C_t): the birth MarketState''s scalar features (as persisted in states.jsonl at the Candidate''s own birth_state_id — never recomputed, never a later clock) UNION the frozen CandidateDraft fields already in the Phase-0 snapshot (expert_id, direction, risk_geometry). No richer representation is used at this pass (v0.2 escalates to a richer phi ONLY after this baseline fails, section 11.1) — this is the CURRENT V8 representation, restated as the task requires.'
        evidence_refs:
        - 'external_document: v0.2 section 15 Phase 3, "Baseline information class... X_t=(S_t,C_t)"'
        confidence: high
      - id: FT002
        label: DECISION
        text: 'Pi (admissible policy class), frozen and small by design (v0.2: "do not start with a powerful unconstrained learner that can memorize the research dataset"): (a) ALWAYS_TRADE — the degenerate policy that takes the actual action on every Candidate, included specifically so the deployed V8 policy IS representable in Pi (the task''s explicit containment requirement for V_A <= V_R to be assertable); (b) THRESHOLD_GATE(feature, direction, quantile) for feature in {rsi14, bb_pct_b, adx14} (three declared, generic, already-computed decision-time features — not searched per slice, fixed before any slice is scored), direction in {NO_TRADE_BELOW, NO_TRADE_ABOVE}, quantile in {0.2, 0.4, 0.6, 0.8} of that feature''s DISCOVERY-half distribution for that slice. |Pi| = 1 + 3*2*4 = 25 policies per slice. A THRESHOLD_GATE policy selects NO_TRADE (utility 0.0 by FCR-V8RR-004 FT011i) when the gate fires, else the actual action''s replayed utility (already in the Phase-0 cube) — no new replay is performed; the policy only SELECTS among already-certified cube utilities.'
        evidence_refs:
        - 'external_document: v0.2 section 15 Phase 3, "Policy classes... Start simple"'
        confidence: high
      - id: FT003
        label: DECISION
        text: 'E (protected evaluation environment) = the SAME chronological discovery (first ~6 months, 4,609 Candidates) / confirmation (remaining ~6 months, 4,609 Candidates) split FCR-V8RR-007 already cut for Phase 2 — reused, not re-cut, so a slice''s Phase-2 and Phase-3 evidence share one split and cannot be gamed by re-splitting. Policy SELECTION (argmax mean utility over Pi) happens on DISCOVERY only; V_R and G_R are estimated on CONFIRMATION only, using the SAME selected policy, never re-selected on confirmation data.'
        evidence_refs:
        - FCR-V8RR-007 (FT006)
        confidence: high
      - id: FT004
        label: DECISION
        text: 'PROMOTION RULE. G_R = V_R - V_A, both means taken over the SAME confirmation-half population (never a mismatched N). Bootstrap (reuse v8.statistics.bootstrap_ci, block_size via select_block_size, same N_RESAMPLES=2000/CI=0.90/seed convention as FCR-V8RR-007 FT004, applied to the per-candidate (policy_utility - actual_utility) delta series) computes a 90% CI on G_R. A slice is RECOVERABLE_WITHIN_CLASS only if ci_lower(G_R) > 0 AND mean(G_R) >= 0.05 R (the same materiality floor as Phase 2, FT007) — a positive point estimate ALONE never promotes (task: "should require a prespecified lower-bound/materiality condition, not merely a positive point estimate"). Otherwise NOT_RECOVERABLE_WITHIN_CLASS — a SCOPED result (this class, this environment), never an absolute unpredictability claim (v0.2 OUTSIDE table, restated).'
        evidence_refs:
        - src/v8/statistics.py (bootstrap_ci, select_block_size — reused unmodified)
        - 'external_document: v0.2 section 11, NOT_RECOVERABLE_WITHIN_CLASS row'
        confidence: high
      - id: FT005
        label: DECISION
        text: 'REPRESENTATION-GAP ESCALATION (deferred, not frozen here): only slices that reach NOT_RECOVERABLE_WITHIN_CLASS on the FT001 baseline are eligible for a SEPARATE, later-declared richer-phi test (v0.2 section 11.1). This contract does not name the richer representation — naming it now, before the baseline result is known, would itself be an undeclared adaptive search.'
        evidence_refs:
        - 'external_document: v0.2 section 11.1'
        confidence: high

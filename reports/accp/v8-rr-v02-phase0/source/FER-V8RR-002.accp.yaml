  sections:
    feature_request_summary:
      summary: 'The request is NOT to build the v0.2 system. It is to determine how much of v0.2 already exists inside V8 and what the minimum Phase-0 addition is. The finding is that V8 already implements the load-bearing half of v0.2 - versioned tape, availability-gated point-in-time state with per-feature lineage, immutable clock-free Candidate identity, an append-only lifecycle, and a deterministic versioned replay simulator whose signature is literally Replay(Candidate, action, future tape; M) -> model-derived outcome. What is missing is an explicit legal-action universe, a materialized outcome cube, a hindsight-gap function, and an abstention state.'
      items:
      - id: FS001
        label: FACT
        text: 'v0.2 requires a post-Candidate evaluator that may consume the realized future ONLY through a declared Replay Model to score legal actions, and may never use the future to construct a decision-time distinction. V8 already enforces the second half structurally: MarketState raises FutureRowError on any row with available_time > as_of, and the evaluator being proposed writes nothing into the state path.'
        evidence_refs:
        - src/v8/marketstate.py:876-890
        - tests/test_vertical_slice.py:37 (test_future_row_rejected)
        confidence: high
      - id: FS002
        label: FACT
        text: 'v0.2 constitutional invariant 1 ("no candidate, no trade" / OUTSIDE_CANDIDATE_UNIVERSE) is already a V8 architectural fact rather than a rule to be added: nothing downstream of PHASE 3 can exist without an emitted CandidateDraft, and the candidate store is append-only with legality-checked transitions.'
        evidence_refs:
        - src/v8/lab.py:787-870
        - src/v8/lifecycle.py:13-35
        confidence: high
      - id: FS003
        label: FACT
        text: 'v0.2 constitutional invariant 4 ("same economic semantics" - fees, funding, capacity, fill rules shared with the evaluated system) is satisfied by construction if and only if the evaluator calls CanonicalSimulator, because cost has exactly one resolution site (cost_r) and funding exactly one (_apply_funding), and both are bound into sim.hash().'
        evidence_refs:
        - src/v8/simulator.py:265-279
        - src/v8/simulator.py:310-342
        - src/v8/simulator.py:658-700
        confidence: high
    existing_surfaces:
      summary: 'Strict ontology-to-code mapping. Status vocabulary: EXISTS_ALIGNED | EXISTS_NEEDS_ADAPTER | PARTIAL | MISSING | SEMANTIC_CONFLICT | NOT_NEEDED_PHASE_0. Minimum action vocabulary: REUSE | WRAP | EXTEND_METADATA | EXTRACT_INTERFACE | ADD_SMALL_COMPONENT | DEFER. Fifteen of sixteen v0.2 objects resolve to REUSE, WRAP, EXTEND_METADATA or DEFER; only three require any new code at all, and none requires a new subsystem.'
      items:
      - id: ON001
        label: FACT
        text: 'MarketTape | status EXISTS_ALIGNED | action REUSE. Representation: schema.TapeRow (three never-collapsed clocks + venue_sequence + channel + payload), store.AppendOnlyLog (JSONL, (source,event_id) dedup, replay_tape sorted by (event_time, available_time, venue_sequence)), identity = AppendOnlyLog.hash bound as ExperimentManifest.data_hash and re-checked at Lab.run. Semantic difference from v0.2: none - "immutable for a certified experiment" is enforced by append-only storage plus a fail-closed manifest pin.'
        evidence_refs:
        - src/v8/schema.py:77-92
        - src/v8/store.py:14-66
        - src/v8/lab.py:980-992
        confidence: high
      - id: ON002
        label: FACT
        text: 'DecisionTimeInformation I_t | status PARTIAL | action EXTEND_METADATA (documentation only for Phase 0; no class). V8 has NO DecisionTimeInformation object and does not need one: I_t at clock D is exactly {tape rows with available_time <= D}, which is recoverable by replaying the hash-bound tape to D, and its consumption is already witnessed three ways - MarketState.provenance.raw_manifest_hash (digest of every kline row admissible at the clock), FeatureValue.max_input_available_time and calculation_time (when each feature became computable), and FeatureValue.input_lineage_hash (hash of the (event_id, payload_hash) identities of the rows that produced that feature, which moves even when the emitted value round-trips). Semantic difference: raw_manifest_hash is kline-only, so it is a VERIFICATION digest of the kline slice of I_t, not an enumeration of all of I_t. That is sufficient for Phase-0 epistemic traceability and must be written down as such rather than overstated.'
        evidence_refs:
        - src/v8/marketstate.py:1352-1367
        - src/v8/schema.py:149-174
        - tests/test_vertical_slice.py:857 (test_per_feature_input_lineage_and_calculation_time)
        - tests/test_vertical_slice.py:867 (test_input_lineage_detects_raw_revision_without_value_change)
        confidence: high
      - id: ON003
        label: FACT
        text: 'ObservableState S_t = phi(I_t) | status EXISTS_ALIGNED | action REUSE. Representation: schema.MarketState, built by marketstate.build_state / build_multi_state (= phi), persisted one record per decision clock in states.jsonl. Identity: state_id = sha1(as_of, universe, lineage_hash); lineage_hash binds value + availability + group + feature_version for every feature. phi itself is versioned twice over - provenance.feature_graph_version (sha1 of the FEATURE_GROUPS table) and provenance.code_version (the marketstate.py whole-file source hash). V8 goes FURTHER than v0.2 requires: per-Expert phi_E exists too (project_state, D-053/D-054), so "what this Expert actually saw" is a distinct, reproducible object from "what the system represented".'
        evidence_refs:
        - src/v8/schema.py:176-189
        - src/v8/marketstate.py:1343-1371
        - src/v8/marketstate.py:1500-1546
        - src/v8/lab.py:511-520
        confidence: high
      - id: ON004
        label: FACT
        text: 'Context / Habitat | status PARTIAL | action DEFER (NOT_NEEDED_PHASE_0). There is no first-class regime/habitat object in the decision path. Habitat is expressed two ways: implicitly, as each Expert''s self-gating predicate (applicability NOT_APPLICABLE / decision NO_HABITAT in ExpertEvaluation), and descriptively, in report-side helpers (tools/diagnostics._entry_regime, _regime_concentration, _time_of_day, _window_split). v0.2 needs habitat only for Phase-2 slicing (Expert x Context x Direction x Component x Regret); Phase 0 does not compute a slice. Introducing a habitat object now would be an ontology-driven class with no Phase-0 consumer.'
        evidence_refs:
        - src/v8/schema.py:192-202
        - tools/diagnostics.py:1696-1762
        confidence: high
      - id: ON005
        label: FACT
        text: 'Expert E | status EXISTS_ALIGNED | action REUSE. experts/base.Expert + 28 family modules, each carrying expert_id, version, mechanism_family_id, behavior_family_id, variant_id and a declared `requires` feature-group set audited against docs/EXPERTS_REGISTRY.yaml by tests/test_expert_registry.py. Determinism and falsifiability are constitutional (rules 5, 13). v0.2''s "Expert output is a hypothesis proposal, not a trade obligation" is already the EXPERT_PROTOCOL wording.'
        evidence_refs:
        - src/v8/experts/base.py:14-82
        - docs/contracts/EXPERT_PROTOCOL.md
        confidence: high
      - id: ON006
        label: FACT
        text: 'Candidate C | status EXISTS_NEEDS_ADAPTER | action WRAP. Identity, immutability and provenance all exist (see the Candidate audit items CA001-CA009 below). What is missing is a single READ-SIDE view that joins the birth transition (candidates.jsonl) to the frozen draft (evaluations.jsonl) - the edge is a re-derivation of episode_key, not a stored foreign key. A wrapper over the existing ledgers is sufficient; a parallel "research Candidate" store is NOT justified and must not be built.'
        evidence_refs:
        - src/v8/lab.py:804-833
        - 'command: python scratchpad/probe_reconcile.py -> "candidates=15 drafts_bound=15 unbound=0"'
        confidence: high
      - id: ON007
        label: FACT
        text: 'Policy | status EXISTS_ALIGNED | action REUSE (no object). v0.2''s Policy is V8''s deployed decision procedure, which is procedural rather than reified: lab PHASE 2 (trigger predicate) + PHASE 1a (pre-entry invalidation, tradability mask, risk admission, fill) + RiskGate + ExposureBook + ExperimentManifest economics. Phase 0 never needs to call the policy - it only needs its OUTPUT (a_actual), which is in the ledger. Reifying a Policy class would be a pure ontology-noun addition.'
        evidence_refs:
        - src/v8/lab.py:522-647
        - src/v8/lab.py:700-785
        - src/v8/risk.py:150-167
        confidence: high
      - id: ON008
        label: GAP
        text: 'LegalActionSet A(C) | status MISSING as an artifact, DERIVABLE from existing declarations | action ADD_SMALL_COMPONENT (a generator, pure data, no state). See the legal-action audit items LA001-LA006 below. A prototype already exists but is bound to the wrong candidate population (tools/diagnostics.EXIT_VARIANTS, 22 cells).'
        evidence_refs:
        - tools/diagnostics.py:1607-1629
        - src/v8/schema.py:229-259
        confidence: high
      - id: ON009
        label: FACT
        text: 'ActualAction a | status EXISTS_NEEDS_ADAPTER | action WRAP. Not stored as one object, but exactly reconstructible from three existing facts: the frozen risk_geometry of the DETECTED draft, the entry bar index (= the EXECUTED transition''s knowledge_time, which is the entry bar''s available_time), and the run manifest economics. Proven by measurement, not inference - see LR001.'
        evidence_refs:
        - src/v8/lab.py:626-647
        - 'command: python scratchpad/probe_reconcile.py'
        confidence: high
      - id: ON010
        label: FACT
        text: 'ReplayModel M | status EXISTS_ALIGNED | action REUSE. CanonicalSimulator.run(draft, bars, times, thesis_valid) -> CounterfactualOutcome IS the v0.2 signature Replay(C, a, W_>t; M). Version binding already exists and is stronger than v0.2 asks: sim.hash() = sha1(policy-era tag, fill_policy, round_trip_cost_r, funding_rate_r, funding_hours, cost FORM, simulator module source hash), and the tag is bumped once per semantic change by an explicit convention documented in the method. See the replay audit RM001-RM008.'
        evidence_refs:
        - src/v8/simulator.py:597-656
        - src/v8/simulator.py:658-700
        confidence: high
      - id: ON011
        label: FACT
        text: 'ReplayOutcome tilde-O(C,a|M) | status EXISTS_ALIGNED for the scalar, PARTIAL for the cost decomposition | action REUSE + EXTEND_METADATA at the cube row (never on the record). schema.CounterfactualOutcome already carries net_r, endpoint, label_status, simulator_hash, horizon_bars, label_available_time, mae_r, mfe_r, ambiguous_bars, entry_price, risk_unit_price and market_move_r (a direction-free passive benchmark over the same window). Missing from the RECORD: the per-episode cost charge and funding paid are not persisted (funding_paid_r lives on OpenPosition only), and there is no exit_price (derivable as entry + sign*gross*unit, which tools/diagnostics already does). Adding fields to CounterfactualOutcome would move sim.hash() and re-pin every golden - so the decomposition belongs on the CUBE ROW, computed by the adapter.'
        evidence_refs:
        - src/v8/schema.py:275-318
        - src/v8/simulator.py:136-176
        - tools/diagnostics.py:486-500
        confidence: high
      - id: ON012
        label: GAP
        text: 'ModelDerivedOutcomeCube | status MISSING as an artifact, substrate EXISTS | action ADD_SMALL_COMPONENT reusing store.AppendOnlyLog (and optionally the existing DuckDB/parquet view pattern). No new database is needed or justified: the repository already persists five ledgers as JSONL and materializes five parquet views from them under a pinned manifest.'
        evidence_refs:
        - src/v8/store.py:14-72
        - tools/materialize_views.py:42-149
        confidence: high
      - id: ON013
        label: GAP
        text: 'LegalHindsightGap g_t^H | status MISSING | action ADD_SMALL_COMPONENT (a pure function over the cube, no state, no persistence of its own beyond a RegretRecord row). Measured to be roughly thirty lines: max over the action set minus the actual-action utility, with explicit tie handling and abstention. See LHG001-LHG004.'
        evidence_refs:
        - 'command: python scratchpad/probe_gap.py'
        confidence: high
      - id: ON014
        label: PARTIAL
        text: 'UNKNOWN / abstention | status PARTIAL | action EXTEND_METADATA (a cube-row status enum, not a new type). V8 already carries a rich refusal vocabulary: label_status NOT_EXECUTED / RIGHT_CENSORED, StateQuality DEGRADED with per-feature null_reason, verdict NO_ECONOMIC_CLAIM (authority blocks first), ATTRIBUTION_UNSAFE_LOW_COVERAGE / ATTRIBUTION_UNSAFE_POPULATION_DIVERGENCE, LabReport.economic_note feasibility annotations, the NOT_EVALUABLE feasibility gate, and several documented fail-closed raises. What is missing is a PER-CELL abstention: the cube must be able to say "this action''s outcome is not defined on this tape" rather than emit a number. This is not a philosophical gap - it is forced by the measured behaviour in the replay audit (RM008).'
        evidence_refs:
        - src/v8/lab.py:66-78
        - src/v8/lab.py:258-283
        - src/v8/schema.py:290-299
        - 'command: python scratchpad/probe_gap.py (abstention probe)'
        confidence: high
      - id: ON015
        label: FACT
        text: 'Finding | status EXISTS_ALIGNED (documentary) | action REUSE. docs/registries/CLAIMS_REGISTRY.yaml and docs/decisions/OPEN_DECISIONS.md already hold structured, evidence-backed regularities with declared support and resolution criteria (O-022 carries a measured blocking matrix; O-027 carries the 79%/+4.5R post-exit finding). No code object is needed in Phase 0.'
        evidence_refs:
        - docs/registries/CLAIMS_REGISTRY.yaml
        - docs/decisions/OPEN_DECISIONS.md
        confidence: high
      - id: ON016
        label: FACT
        text: 'Hypothesis H | status EXISTS_ALIGNED (documentary) | action REUSE. docs/PREREGISTRATION_V8_SLICE_001.md plus docs/registries/EXPERIMENT_REGISTRY.yaml plus the constitutional challenger rule (versions evolve by challenger + frozen-OOS + registry decision, never in place) already implement "must specify expected mechanism and rejection condition".'
        evidence_refs:
        - docs/PREREGISTRATION_V8_SLICE_001.md
        - docs/charter/V8_CONSTITUTION.md (rules 5, 11, 15)
        confidence: high
      - id: ON017
        label: FACT
        text: 'Intervention I | status EXISTS_ALIGNED (documentary + mechanism) | action REUSE. The single-changed-dimension discipline is already constitutional, and the mechanism for a component intervention already exists in code as a geometry override replayed through the same simulator (tools/diagnostics._walk_result sl/tp/expiry/geometry_extra). v0.2 H7 (single-intervention comparison) is therefore already V8 policy rather than a proposal.'
        evidence_refs:
        - tools/diagnostics.py:378-455
        - docs/charter/V8_CONSTITUTION.md (rule 15)
        confidence: high
      - id: CA001
        label: FACT
        text: 'CANDIDATE AUDIT 1 - Is Candidate first-class? YES. It has its own identity function (episode_key), its own ledger (candidates.jsonl), its own state machine with a legality table, its own duplicate-suppression record type, and a constitutional rule that Candidate, order and outcome are distinct immutable records (rule 4).'
        evidence_refs:
        - src/v8/lifecycle.py:42-146
        - docs/charter/V8_CONSTITUTION.md (rule 4)
        confidence: high
      - id: CA002
        label: FACT
        text: 'CANDIDATE AUDIT 2 - Immutable after birth? YES. CandidateDraft is a frozen dataclass; the birth snapshot is merged into the DETECTED transition BEFORE append (so it "can never be added later" - the code says so explicitly); the log is append-only with (source,event_id) dedup and a re-validating replay. Corrections append a superseding event.'
        evidence_refs:
        - src/v8/schema.py:204-206
        - src/v8/lifecycle.py:82-108
        - src/v8/store.py:35-48
        confidence: high
      - id: CA003
        label: FACT
        text: 'CANDIDATE AUDIT 3 - Can birth state be reconstructed exactly? YES, and by two independent routes: the DETECTED record carries state_id, and states.jsonl persists the full MarketState for that clock; the ExpertEvaluation record independently carries state_id plus the full draft. The per-Expert VIEW is also reconstructible because project_state is a pure function of (canonical state, declared groups, intervals, depths).'
        evidence_refs:
        - src/v8/lab.py:511-520
        - src/v8/lab.py:824-833
        - src/v8/marketstate.py:1500-1546
        confidence: high
      - id: CA004
        label: FACT
        text: 'CANDIDATE AUDIT 4 - Is Expert/version provenance retained? YES, redundantly: expert_id and expert_version are on the draft, on the evaluation record, on the DETECTED snapshot, and inside the episode_key hash itself, so a version bump necessarily produces a different candidate identity.'
        evidence_refs:
        - src/v8/lifecycle.py:42-50
        - src/v8/lab.py:824-833
        confidence: high
      - id: CA005
        label: FACT
        text: 'CANDIDATE AUDIT 5 - Are decision-time features stored or reproducibly recoverable? BOTH. states.jsonl stores every feature of every decision clock (DATASET_SPEC layer 2), and the state is independently reproducible because build_state is a pure function of (rows, as_of, universe, feature_version, depth) - which is exactly what the cached-vs-uncached identity test pins.'
        evidence_refs:
        - src/v8/lab.py:518-520
        - tests/test_state_cache_identity.py
        - tests/test_vertical_slice.py:824 (test_revision_replay_reproduces_prior_state_hash)
        confidence: high
      - id: CA006
        label: FACT
        text: 'CANDIDATE AUDIT 6 - Is Candidate distinct from order/trade/outcome? YES. The candidate ledger holds transitions; the outcome ledger holds exactly one terminal CounterfactualOutcome per candidate; a PARTIAL_EXIT is a lifecycle position_action and explicitly "never a CounterfactualOutcome.endpoint"; ORDER_SUBMITTED and EXECUTED are distinct lifecycle states rather than fields on the candidate.'
        evidence_refs:
        - src/v8/lifecycle.py:110-136
        - src/v8/lab.py:626-628
        confidence: high
      - id: CA007
        label: FACT
        text: 'CANDIDATE AUDIT 7 - Does lifecycle mutation contaminate historical state? NO. Current state is a PROJECTION of the log (CandidateRegistry._apply_projection), never a mutable field; reactivation after a terminal state has no legal edge; a corrupt log with an illegal transition raises on replay instead of silently projecting an unreachable state.'
        evidence_refs:
        - src/v8/lifecycle.py:56-80
        confidence: high
      - id: CA008
        label: FACT
        text: 'CANDIDATE AUDIT 8 - Deterministic unique identity? YES, and deliberately clock-free: the key is anchored to setup_anchor_event_id (the first closed bar of the current consecutive predicate run) rather than the birth timestamp, precisely so a re-detected setup hashes identically. Key stability is a pinned test.'
        evidence_refs:
        - src/v8/lifecycle.py:42-50
        - src/v8/experts/base.py:104-127
        - tests/test_vertical_slice.py:174 (test_episode_key_stable_across_consecutive_decision_clocks)
        confidence: high
      - id: CA009
        label: FACT
        text: 'CANDIDATE AUDIT 9 - Can the Candidate universe be frozen for an experiment? YES. One store directory = one immutable run (a second run fails closed); the universe is bound by candidates.hash inside ledger_hash, which additionally binds the manifest config hash and the risk-gate config hash; and the compile-once materialization writes a views_pin over code, view SQL, economics and ledger hash.'
        evidence_refs:
        - src/v8/lab.py:293-297
        - src/v8/lab.py:976-979
        - tools/materialize_views.py:119-135
        confidence: high
      - id: CA010
        label: RISK
        text: 'CANDIDATE AUDIT - the one genuine defect. The evaluations ledger carries no candidate_id and the candidates ledger carries no draft, so the Candidate-to-geometry edge is a RE-DERIVATION. It was measured total and exact (15/15) on the golden fixture, but it silently depends on _geometry_version''s exclusion list (atr_ref, prior_high_ref, prior_low_ref) staying in sync between the writer and the reader. That coupling must be frozen in the contract, not left implicit.'
        evidence_refs:
        - src/v8/lab.py:166-173
        - src/v8/lab.py:804-812
        - 'command: python scratchpad/probe_reconcile.py'
        confidence: high
      - id: LA001
        label: FACT
        text: 'LEGAL ACTION AUDIT 1 - NO_TRADE. Zero exposure is genuinely admissible in the evaluated configuration: the system rejects candidates for TRADABILITY_MASK_VETO, EXISTING_EXPOSURE_CONFLICT, PORTFOLIO_HEAT_EXCEEDED and excess_cost, and every such candidate keeps a NOT_EXECUTED record. NO_TRADE therefore needs no simulator call at all - its utility is exactly 0.0 R by definition (no entry, no cost, no funding). Measured: NO_TRADE was the argmax for 8 of 12 executed golden candidates.'
        evidence_refs:
        - src/v8/lab.py:576-625
        - 'command: python scratchpad/probe_gap.py'
        confidence: high
      - id: LA002
        label: FACT
        text: 'LEGAL ACTION AUDIT 2 - direction is NOT mutable post-Candidate. direction is fixed on the draft at birth, is part of episode_key, and drives the ExposureBook slot. A direction-flip action would be a DIFFERENT candidate, not a legal alternative for this one. It therefore belongs in the fault-injection harness (v0.2 section 14.3 "long/short sign flipped -> DIRECTION") as a deliberately illegal probe, never in A(C).'
        evidence_refs:
        - src/v8/schema.py:204-215
        - src/v8/lifecycle.py:42-50
        confidence: high
      - id: LA003
        label: FACT
        text: 'LEGAL ACTION AUDIT 3 - the FINITE enumerable axes, all already implemented and declared-only in the simulator: fill/entry policy (fill_policy in {FILL_AT_BAR_CLOSE, FILL_AT_LIMIT}, anything else fails closed); presence/absence of a declared trigger (trigger_ref + trigger_side in {CLOSE_ABOVE, CLOSE_BELOW}); stop KIND (R-multiple stop_r vs absolute structural stop_ref); management KIND (breakeven roll, chandelier trail, scale-out, time exit - each independently present or absent); and NO_TRADE. pyramid_add_rules is DECLARED BUT FAILS CLOSED and must be excluded from A(C) - including it would make the action set claim a semantics the stepper does not implement.'
        evidence_refs:
        - src/v8/simulator.py:195-208
        - src/v8/simulator.py:420-486
        - src/v8/lab.py:726-740
        confidence: high
      - id: LA004
        label: FACT
        text: 'LEGAL ACTION AUDIT 4 - the CONTINUOUS parameters, which must be listed separately from the finite axes and can only be sampled on a declared grid: target_r, stop_r, expiry_bars, time_exit_bars, trail_stop_atr, breakeven_roll_at_mfe_r, breakeven_margin_r, scale_out_ratio, scale_out_at_mfe_r, limit_price. A grid over these is a SEARCH, so its cardinality is evidence burden under rule 11 / D-046 and must be recorded in the manifest, exactly as tools/diagnostics already does with EXIT_CROSS_NAMES for its multiplicity correction.'
        evidence_refs:
        - src/v8/schema.py:229-259
        - tools/diagnostics.py:1624-1629
        confidence: high
      - id: LA005
        label: FACT

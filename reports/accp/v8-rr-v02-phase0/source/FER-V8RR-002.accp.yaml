    user_value:
      summary: 'The research value is high and unusually well-targeted: three of the repository''s own open decisions are exactly the questions v0.2 formalizes, and the Phase-0 instrument is the missing measurement device for all three. The engineering value is that this is a read-only addition - it can be built and certified without touching a single line of the decision path.'
      items:
      - id: UV001
        label: FACT
        text: 'O-027 (is the 1R take-profit clipping a real favorable tail? 79% of target exits continued beyond 2R; mean post-exit max +4.5R; intrabar ambiguity bracket 1.79R wide over 144 double-touch trades) is a hindsight-gap question stated in v0.2''s exact vocabulary. Today the repository can only answer it with an unbound diagnostic grid whose authority is NONE; a Candidate-bound outcome cube would make it answerable against the actual ledger population.'
        evidence_refs:
        - docs/decisions/OPEN_DECISIONS.md (O-027)
        - tools/diagnostics.py:1593-1629
        confidence: high
      - id: UV002
        label: FACT
        text: 'O-013 (does active position management beat static geometry?) becomes measurable at zero marginal simulator cost, because breakeven roll, chandelier trail, scale-out and time exit are ALREADY implemented and declared-only in the simulator - they are legal actions waiting for an evaluator, not features waiting to be built.'
        evidence_refs:
        - docs/decisions/OPEN_DECISIONS.md (O-013)
        - src/v8/simulator.py:420-486
        confidence: high
      - id: UV003
        label: FACT
        text: 'O-014 (do executed and portfolio-rejected populations differ systematically?) already has a gate in code (D-027: execution_share floor 0.25, KS <= 0.20) that blocks the economic verdict. v0.2''s decomposition explains WHY that gate is the right instrument and where its blind spot is: it compares populations, not actions, so it cannot say whether the loss is in selection, geometry or exit. The cube supplies the missing axis.'
        evidence_refs:
        - docs/decisions/OPEN_DECISIONS.md (O-014)
        - src/v8/lab.py:66-78
        confidence: high
      - id: UV004
        label: FACT
        text: 'The v0.2 epistemic classes map cleanly onto labels the repository already enforces (OBSERVED / MODEL_DERIVED / STATISTICALLY_INFERRED / HYPOTHESIZED / UNKNOWN against LITERATURE_SUPPORTED / PROJECT_EVIDENCE_SUPPORTED / DESIGN_INFERENCE / PROVISIONAL_DECISION / LOCKED_INVARIANT / OPEN_QUESTION / REJECTED_OPTION). They are different axes - v0.2 classifies HOW a claim was produced, V8 classifies WHAT supports it - so they compose rather than compete, and no label vocabulary needs replacing.'
        evidence_refs:
        - docs/charter/V8_CONSTITUTION.md (rule 2)
        confidence: high
      - id: UV005
        label: INFERENCE
        text: 'Because the evaluator lives outside src/v8 and reads only append-only ledgers, it cannot regress the decision path, cannot change any pinned hash bound by the goldens (ledger_hash does not bind tooling_hash), and can be deleted without trace if Phase 0 fails certification. That is the cheapest possible falsification posture for a new instrument.'
        evidence_refs:
        - src/v8/lab.py:976-979
        - src/v8/lab.py:115-122
        - tools/diagnostics.py:99-123
        confidence: high
    risks:
      summary: 'Five real risks, in descending order of consequence. None is an architectural conflict; four are contract-freezable and one is an environment repair.'
      items:
      - id: RK001
        label: RISK
        text: 'DUPLICATION OF TRUTH. tools/diagnostics.py already owns a legal-action grid, a replay-with-override core and a post-exit continuation measure, operating on a DIFFERENT candidate population (entry = birth + lag 2, no lifecycle, no gates, non-canonical candidate_id). Building a second such engine without a declared relationship would recreate exactly the parallel-truth problem the 2026-08-08 consolidation was performed to remove. Mitigation: the Phase-0 evaluator must be Candidate-bound (ledger population, canonical episode_key) and must state in its module docstring that the diagnostic engine''s population is NOT the evaluator''s population.'
        evidence_refs:
        - tools/diagnostics.py:1-17
        - tools/diagnostics.py:262-265
        - tools/diagnostics.py:1607-1629
        confidence: high
      - id: RK002
        label: RISK
        text: 'SILENT ADMISSION OF FABRICATED OUTCOMES. Per RM008, run() returns numbers for degenerate futures. An argmax that admits them would report a hindsight gap built on a trade that could not exist. Mitigation: the adapter''s abstention rule is a FROZEN CONTRACT (FCR), and the boundary is a required golden test (a candidate entering on the final bar must produce UNDEFINED_FUTURE, never -cost).'
        evidence_refs:
        - 'command: python scratchpad/probe_gap.py (abstention probe)'
        confidence: high
      - id: RK003
        label: RISK
        text: 'CENSORING CONTAMINATION OF THE ARGMAX. A longer-horizon action near the tape end returns RIGHT_CENSORED; silently maximizing over a mixture of MATURE and RIGHT_CENSORED cells produces a gap that is partly an artifact of where the tape stops. Mitigation: the gap function abstains (UNKNOWN_CENSORED) whenever any potentially-maximizing cell is not MATURE, rather than truncating or imputing.'
        evidence_refs:
        - 'command: python scratchpad/probe_censor.py'
        - src/v8/schema.py:290-299
        confidence: high
      - id: RK004
        label: RISK
        text: 'GOLDEN BASELINE IS RED. The repository''s only end-to-end regression gate currently fails (RIR GR002), with a provenance-only signature but no re-pin. A Phase-0 reconciliation test anchored to a store whose golden does not reproduce cannot distinguish "the evaluator is wrong" from "the baseline moved". Mitigation: re-pin (or explicitly quarantine) the golden BEFORE step 2 of the implementation plan - this is the reordering justification in the FDR.'
        evidence_refs:
        - 'command: python -m pytest tests/test_golden_backtest.py -q'
        confidence: high
      - id: RK005
        label: RISK
        text: 'SEARCH-BURDEN CREEP. The continuous action axes (LA004) make it trivial to grow the grid until a large gap appears. That is the backtest-overfitting failure mode v0.2 section 10.2 and V8 rule 11 / D-046 both name. Mitigation: the action manifest carries its own cardinality and a version hash, the cardinality is reported with every gap, and Phase 0 computes NO statistics at all - it produces the cube and the gap and stops.'
        evidence_refs:
        - tools/diagnostics.py:1624-1629
        - docs/charter/V8_CONSTITUTION.md (rule 11)
        confidence: high
      - id: RK006
        label: RISK
        text: 'PROVENANCE PORTABILITY. _code_hash embeds the OS path separator (RIR GR004), so a manifest pinned on POSIX fails closed on Windows and vice versa. v0.2 invariant 6 requires every replay outcome to bind a code version; if that binding is platform-dependent, cross-machine reproduction of a certified cube is impossible. Mitigation: out of Phase-0 scope to fix, but the cube must record the platform alongside the code hash so the limitation is visible rather than silent.'
        evidence_refs:
        - src/v8/lab.py:103-112
        confidence: high
    open_questions:
      summary: 'Four questions that the design deliberately does not answer, each with the reason it is safe to leave open for Phase 0.'
      items:
      - id: OQ001
        label: GAP
        text: 'Where should the evaluator live - tools/ (like diagnostics.py, outside the decision path, no D-032 registry decision needed) or src/v8/ (inside the file family, requiring a register decision + CHANGELOG per D-032)? The FDR recommends tools/, and the reasons are stated there; but this is an operator decision about the file family, not a technical necessity.'
        evidence_refs:
        - docs/contracts/IMPLEMENTATION_LAYOUT.md:1-8
        confidence: high
      - id: OQ002
        label: GAP
        text: 'Should tools/diagnostics.py''s exit grid eventually be RE-EXPRESSED as a consumer of the Phase-0 legal action manifest (removing the duplication) or left as an independent report-side probe? Phase 0 does not need to decide; Phase 1 will, and deciding early would be a refactor the task forbids.'
        evidence_refs:
        - tools/diagnostics.py:1607-1629
        confidence: medium
      - id: OQ003
        label: GAP
        text: 'What is the authoritative utility unit for cross-Candidate comparison once sizing is in play? R is the unambiguous per-Candidate unit and is what Phase 0 uses. The equity/currency reading (equity.py, risk_per_trade) exists but is a portfolio quantity and would drag portfolio feasibility into a Candidate-local evaluator. Left open, with R frozen for Phase 0.'
        evidence_refs:
        - src/v8/equity.py
        - docs/contracts/SIMULATION_TRUTH_SPEC.md (R is a declared price distance, D-028)
        confidence: high
      - id: OQ004
        label: MISSING_EVIDENCE
        text: 'Does the reconciliation identity survive a REAL tape (funding schedule active, DEGRADED states, tradability vetoes, heat rejections, multi-month horizons)? Unmeasured (RIR GR009). It is the first thing step 2 of the implementation plan should establish, and a failure there would be a genuine blocker rather than a repair.'
        evidence_refs:
        - 'command: ls (no real tape store in the inspected tree)'
        confidence: high
    recommendation:
      summary: 'PROCEED with a minimal, read-only, Candidate-bound Phase-0 evaluator built on the existing simulator and ledgers. Prefer existing implementation + adapter over new subsystem everywhere; the only genuinely new artifacts are a legal-action manifest generator, a replay adapter with an abstention boundary, a cube writer and a gap function. Reuse assessment and the precise patch surface are in FDR-V8RR-003.'
      items:
      - id: RC001
        label: DECISION
        text: 'REUSE SCORE (ranges, not false precision). Reusable as-is: 65-80% of the Phase-0 system - versioned tape and store, PIT state builder and its lineage, Expert layer, candidate identity and lifecycle ledgers, the canonical simulator as ReplayModel, hashing/provenance, the synthetic fixture, the pytest harness, and the materialization pattern. Reusable with adapters/metadata: 10-20% - the Candidate snapshot join, actual-action binding, cube-row cost/funding decomposition, abstention states. Genuinely new: 10-20% - legal action manifest generator, replay adapter boundary, cube writer, gap function, fault-injection harness. Conceptually conflicting: 0-5% - only naming collisions (RIR GR008) and the NOT_APPLICABLE slippage column.'
        evidence_refs:
        - ON001
        - ON008
        - ON012
        - ON013
        confidence: medium
      - id: RC002
        label: DECISION
        text: 'HIGHEST-COST INTEGRATION POINTS, in order: (1) the abstention boundary, because it is the only place where a correct-looking number is silently wrong (RM008, OC003); (2) the Candidate-to-draft join, because it is a re-derivation coupled to _geometry_version''s exclusion list (CA010); (3) the legal action manifest''s cardinality discipline, because it is where search burden enters (RK005); (4) re-pinning the golden baseline before anything is anchored to it (RK004).'
        evidence_refs:
        - RM008
        - CA010
        - RK004
        confidence: high
      - id: RC003
        label: DECISION
        text: 'ANSWER TO THE DECISIVE QUESTION. Yes - V8 can be turned into a certified post-Candidate counterfactual diagnostic system mostly by EXPOSING AND FREEZING semantics that are already present. The four semantics to expose are: the Candidate-to-action join that already exists as a re-derivation; the action vocabulary that is already declared in risk_geometry and the manifest but never enumerated; the replay signature that is already exactly Replay(C,a,W;M) but is only ever called with the actual action; and the refusal discipline that already exists everywhere in the lab but not at the replay boundary.'
        evidence_refs:
        - LR001
        - RM001
        - LA003
        - RM008
        confidence: high
      - id: RC004
        label: DECISION
        text: 'ACCP FIT - where it helps: this evidence chain (RIR/FER/FDR/FCR) as a read-only design record; later IPR or FIR for the implementation patch with diff integrity and a rollback plan; TVR/FGR for validation evidence with real command output; PRR at Phase-0 promotion; ECR to bundle the certification evidence; HIR/DCR only on a genuine blocker or authority conflict. Where it must stay OUT: ACCP does not become the scientific ontology, ACCP reports are NOT ReplayOutcome objects, ACCP does not decide scientific truth, ACCP does not authorize a V8 action, and NO ACCP runtime object, report engine, routing machinery or protocol infrastructure enters src/v8 or the hot path. The repository contains no ACCP infrastructure today, and none is proposed.'
        evidence_refs:
        - 'external_document: accp_v2_0_strict_yaml_onefile_master.accp.yaml (authority_boundary; report_type_registry)'
        - 'external_document: v0.2 section 18 (Relationship to ACCP)'
        confidence: high
      - id: RC005
        label: DECISION

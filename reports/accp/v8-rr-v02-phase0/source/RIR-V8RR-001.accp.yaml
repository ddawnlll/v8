        confidence: high
      - id: GR006
        label: GAP
        text: 'MarketState.provenance.raw_manifest_hash covers the KLINE channel only ("for r in rows if r.channel == ''kline''"). funding and open_interest rows admissible at the same clock are not in that digest; their lineage is carried only by the per-feature input_lineage_hash of positioning-group features and by the experiment-level data_hash over the whole tape. For Phase-0 epistemic traceability this is sufficient (I_t is recoverable by replaying the tape to as_of, and the whole tape is hash-bound), but the per-clock digest must not be described as a complete I_t manifest.'
        evidence_refs:

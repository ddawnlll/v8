      - id: GR003
        label: FACT
        text: 'FAILURE 2 - tests/test_bugfix_pass.py::test_code_hash_excludes_vendored_simtruth. The TEST mirrors _code_hash''s simtruth exclusion with k.split("/"), but on Windows the relative keys are backslash-separated ("experts\\\\__init__.py"), so the mirror fails to exclude simtruth while _code_hash (which uses p.parts) excludes it correctly. The test is wrong on Windows, not the code.'
        evidence_refs:
        - 'command: python -m pytest tests/test_bugfix_pass.py::test_code_hash_excludes_vendored_simtruth -q'
        - 'command: python -c "print([str(p.relative_to(base)) for p in sorted(base.rglob(''*.py''))][:3])" -> [''__init__.py'', ''equity.py'', ''experts\\\\__init__.py'']'
        - src/v8/lab.py:103-112
        confidence: high
      - id: GR004
        label: RISK
        text: 'Consequence of GR003 that is NOT a test bug: _code_hash keys on str(p.relative_to(base)), which embeds the OS path separator. The same source tree therefore hashes differently on Windows and POSIX, so a manifest code_hash pinned on one platform fails closed on the other (lab.py:986-989). This is a provenance-portability defect that v0.2 "version-bound derivation" (invariant 6) depends on.'
        evidence_refs:

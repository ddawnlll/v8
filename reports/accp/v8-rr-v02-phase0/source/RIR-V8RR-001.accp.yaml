        confidence: high
      - id: GR007
        label: RISK
        text: 'Replay boundary defect for a Phase-0 evaluator: CanonicalSimulator.run returns a NUMBER when the future path is degenerate. Measured - run(draft, [entry_bar_only]) -> (EXPIRY, net_r -0.07, RIGHT_CENSORED, horizon 0), i.e. a manufactured cost-only round trip on a position that never had a future; run(draft, []) -> (EXPIRY, 0.0, RIGHT_CENSORED), a fabricated non-trade. The Lab already refuses to use this path and records INVALIDATED_BEFORE_TRIGGER instead, with an explicit in-code rationale. Any evaluator that feeds a tail directly to run() and takes a max over the results would silently admit these fabricated values into the hindsight best action.'

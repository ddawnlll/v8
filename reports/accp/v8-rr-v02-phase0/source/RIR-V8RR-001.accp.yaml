        text: 'Naming collision hazard between the two documents. (a) "Phase 0" means "Foundation (DONE 2026-08-01)" in docs/ROADMAP.md and "Infrastructure semantics certification" in v0.2 section 15 - these are different phases of different programs. (b) "counterfactual" already has a NARROWER established meaning in V8 (the batch NOT_EXECUTED outcome of a candidate that did not execute) than v0.2''s (any legal alternative action replayed on the realized path). Both must be disambiguated in writing before any docs/ text is authored, or the corpus will contradict itself.'

    gaps_and_risks:
      summary: 'Three test failures at HEAD (two are Windows-environment artifacts, one is a real un-repinned golden), one platform-dependent hash, one kline-only per-clock manifest digest, and one replay boundary where the simulator returns a NUMBER for a future path that does not exist. None of them is an architectural conflict; all are local.'
      items:
      - id: GR001
        label: FACT
        text: 'Full suite at HEAD 1053dc1: `python -m pytest tests -q --ignore=tests/test_expert_scenarios.py` -> 3 failed, 730 passed, 1 skipped in 226.04s. (test_expert_scenarios.py is the untracked working-tree file and was excluded.)'

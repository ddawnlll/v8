        text: 'The DETECTED birth snapshot is written as `extra` merged into the transition record BEFORE append, so it is part of the immutable append-only event and can never be added later. It carries expert_id, expert_version, instrument, direction, setup_anchor_event_id, geometry_version and state_id.'

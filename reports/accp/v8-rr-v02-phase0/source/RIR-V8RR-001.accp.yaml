      - id: GR002
        label: RISK
        text: 'FAILURE 1 - tests/test_golden_backtest.py::test_golden_backtest_regression. The pinned GOLDEN_LEDGER_HASH 8c847351... does not reproduce; live is fae2a5de5b052415d0378129859902336a94d798. Isolated: data_hash MATCHES (1c41077b...), candidate_count MATCHES (15), terminal_distribution MATCHES ({CLOSED:12, INVALIDATED:1, REJECTED:2}), states_hash MOVED (live 8b5c1fc4e04c3a3d48b33c164d0b095d101f3b20 vs pinned 786378b5...). That invariance signature is the file''s own documented "code_version moved" pattern (marketstate.py _BUILDER_SRC_HASH is a whole-file hash and HEAD changed marketstate.py by 774 lines), i.e. provenance-only drift with no decision change - but the golden was NOT re-pinned in that commit, so the repository''s only end-to-end regression gate is currently RED.'
        evidence_refs:

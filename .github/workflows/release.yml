name: Release Build and Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: v8-core-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: v8-core-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: |
          cargo build --release --manifest-path v8-core/Cargo.toml --target ${{ matrix.target }}

      - name: Package Binary
        run: |
          cp target/${{ matrix.target }}/release/v8-core ./${{ matrix.artifact_name }}
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

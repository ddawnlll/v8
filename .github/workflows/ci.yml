# CI for research code (OPERATIONS_SPEC section 4, D-097): tests on every
# change plus the v8-core Rust unit tests, the monograph byte-identity probe,
# and the gate-3 forbidden-component-name scan (AGENT_RUNBOOK section 4).
# The Python test/parity suites are retired from CI (D-097): the Rust plane
# is the authoritative implementation; verification is cargo per change and
# golden vectors (pinned from the S0-S7-verified outputs) as the release gate.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install package (dev + tooling extras)
        run: uv pip install --python "$(which python)" -e ".[dev,tooling]"

      - name: Gate 3 — no forbidden component identifiers
        run: python3 tools/forbidden_names.py

      - name: Python/Rust ownership boundary
        run: python3 tools/audit_python_boundary.py

      - name: v8-core unit tests (debug, catches checked arithmetic failures)
        working-directory: v8-core
        run: cargo test

      - name: v8-core GPU feature compile
        working-directory: v8-core
        run: cargo check --features gpu

      - name: v8-core GPU feature tests
        working-directory: v8-core
        run: cargo test --features gpu

      - name: v8-core no-default-features Clippy
        working-directory: v8-core
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: v8-core Linux GPU cross-compile
        working-directory: v8-core
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --target x86_64-unknown-linux-gnu --features gpu

      - name: v8-core unit tests (release, fp-contract=off)
        working-directory: v8-core
        # fp-contract=off comes from v8-core/.cargo/config.toml. Golden-vector
        # release-gate verification (pinned fixtures -> byte-identical hashed
        # outputs) is the follow-up wiring tracked in D-097.
        run: cargo test --release

      - name: FILL_AT_LIMIT CPU/oracle parity gate
        run: python3 -m pytest tests/parity/test_parity_fill_limit.py -q

      - name: Monograph byte-identity probe
        run: |
          "$(which python)" tools/build_monograph.py --lang en --docs docs --out /tmp/v8_probe.html
          n=$(sha256sum /tmp/v8_probe.html site/index.html | awk '{print $1}' | sort -u | wc -l)
          if [ "$n" -ne 1 ]; then echo "probe differs from site/index.html"; exit 1; fi
          echo "monograph byte-identical: OK"

[package]
name = "v8-core"
version = "0.2.0"
edition = "2021"
description = "V8.2 Rust compute plane: dataset, features, state, replay, cube, regret reduction, evidence store (COMPUTE_CORE_SPEC)"
license = "UNLICENSED"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is NOT correctly rounded
# (measured: "0.9632136759338213" parses 1 ulp low) — it would silently change
# every request-side float (geometry refs, manifest) and break value parity.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"

[profile.release]
codegen-units = 1
lto = true

# The compute plane links no Python runtime (no-callback invariant, D-078).

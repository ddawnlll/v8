[package]
name = "v8-core"
version = "0.2.0"
edition = "2021"
description = "V8.2 Rust compute plane: dataset, features, state, replay, cube, regret reduction, evidence store (COMPUTE_CORE_SPEC)"
license = "UNLICENSED"

[dependencies]
bytemuck = { version = "1", optional = true }
pollster = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is NOT correctly rounded
# (measured: "0.9632136759338213" parses 1 ulp low) — it would silently change
# every request-side float (geometry refs, manifest) and break value parity.
serde_json = { version = "1", features = ["float_roundtrip"] }
arrow-array = "59.3.0"
arrow-schema = "59.3.0"
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "snap"] }
redb = "2.6.3"
sha1 = "0.10"
sha2 = "0.10"
blake3 = "1.5"
thiserror = "2.0"
memmap2 = "0.9"
bincode = "1.3"
tracing = "0.1"
metrics = "0.24"
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "glsl"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 2
debug = 1

[features]
# Backend-2 GPU (issue #2): pulls wgpu (Vulkan/Metal/HIP via portability). The
# default build has no GPU code — `gpu` is only for the AMD/Linux probe and
# parity gate. D-096's "no dependency added now" default is preserved: without
# this feature, no GPU crate is compiled.
gpu = ["dep:bytemuck", "dep:wgpu", "dep:pollster"]

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
approx_constant = "allow"
unnecessary_sort_by = "allow"
manual_range_contains = "allow"
cloned_ref_to_slice_refs = "allow"
neg_cmp_op_on_partial_ord = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
ptr_arg = "allow"
redundant_closure = "allow"
len_without_is_empty = "allow"
new_without_default = "allow"
should_implement_trait = "allow"
match_like_matches_macro = "allow"
single_match = "allow"
manual_map = "allow"
derivable_impls = "allow"
manual_unwrap_or_default = "allow"
assign_op_pattern = "allow"
comparison_chain = "allow"
manual_clamp = "allow"
large_enum_variant = "allow"
vec_init_then_push = "allow"
explicit_auto_deref = "allow"
write_with_newline = "allow"
useless_conversion = "allow"
from_over_into = "allow"
upper_case_acronyms = "allow"
enum_variant_names = "allow"
uninlined_format_args = "allow"
doc_lazy_continuation = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
redundant_clone = "allow"
extra_unused_lifetimes = "allow"
arc_with_non_send_sync = "allow"
manual_flatten = "allow"
redundant_pattern_matching = "allow"
manual_unwrap_or = "allow"
manual_is_ascii_check = "allow"
manual_strip = "allow"
bool_assert_comparison = "allow"
match_str_case_mismatch = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# The compute plane links no Python runtime (no-callback invariant, D-078).

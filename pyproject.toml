[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v8-research"
version = "0.1.0"
description = "V8 research runtime - Phase 2 deterministic baseline vertical slice"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# pyyaml added at runbook step 6: the expert-registry gate requires
# docs/EXPERTS_REGISTRY.yaml to actually parse (tests/test_expert_registry.py).
dev = ["pytest>=8", "markdown>=3.5", "pyyaml>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

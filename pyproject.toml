[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v8-research"
version = "0.1.0"
description = "V8 research runtime - Phase 2 deterministic baseline vertical slice"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# pyyaml added at session-1 step 6: the expert-registry gate requires
# docs/EXPERTS_REGISTRY.yaml to actually parse (tests/test_expert_registry.py).
dev = ["pytest>=8", "markdown>=3.5", "pyyaml>=6"]
# tooling added at session-2 step 1: Phase-1 parquet materialization
# (DATASET_SPEC section 5) admits the heavy archive-builder deps for
# tools/data.py (D-037). Decision path stays stdlib-only (O-009).
tooling = ["polars>=1.30", "pyarrow>=18", "pandera[polars]>=0.24", "duckdb>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

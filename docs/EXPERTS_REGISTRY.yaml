# V8 Pilot Expert Registry (EXPERT_PROTOCOL section 4; ROADMAP Phase 3).
#
# Status lifecycle: PROPOSED -> FORMALIZED -> SCREENING -> REPLICATION ->
# SHADOW -> PROMOTED; REJECTED / MERGED / QUARANTINED / DATA_BLOCKED.
# No registry experiment is registered and nothing is promoted
# (V8_CONSTITUTION rule 13). The code-side projection must match this file
# exactly (tests/test_expert_registry.py), so the ontology cannot drift.
#
# variants_evaluated (D-044): every variant_id of this family evaluated on
# the development window, losing variants included — not just the reported
# variant_id below. This is what PREREGISTRATION_V8_SLICE_001 section 11
# reads to decide whether the family's alpha budget is spent by the
# single-configuration percentile-bootstrap test (len == 1) or the
# within-family Reality-Check max-statistic test (len > 1). A variant
# dropped after evaluation is still listed here — it cannot be un-evaluated.
#
# search_universe_size (D-046): the TOTAL number of configurations the search
# actually consumed to arrive at this family — every threshold, lookback,
# filter and indicator variant tried, the direction-sign choice, and losers
# discarded before they ever earned a variant_id. `variants_evaluated` is the
# subset whose episode series were retained, so it is only a LOWER BOUND on
# the search; Aronson Ch8 p390-391 requires the complete record, because a
# family p-value computed from the retained subset is optimistic by exactly
# the amount the search exceeded it (his 6,402-rule case collapses to 3 units
# under a family-counts-as-one rule and turns p=0.82 into a false pass).
#
# All five pilots declare 1. That is not an omission: preregistration §4
# records that every detector parameter (EMA 5/20, ATR 14, the 32-bar
# prior-high window, expiry 8) was frozen in code against synthetic tapes
# BEFORE the real development window existed, and no development search was
# performed — so there is no undisclosed configuration to count. A family that
# tunes anything on data must raise this number and re-run the Reality Check.

